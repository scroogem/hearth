plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

repositories {
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Git storage. slf4j and commons-codec already ship with Minecraft.
	include(implementation("org.eclipse.jgit:org.eclipse.jgit:${project.jgit_version}"))
	include(implementation("com.googlecode.javaewah:JavaEWAH:1.2.3"))
	// Per-world SSH deploy keys let invited players use GitHub without GitHub accounts.
	include(implementation("org.eclipse.jgit:org.eclipse.jgit.ssh.apache:${project.jgit_version}"))
	include(implementation("org.apache.sshd:sshd-osgi:2.19.0"))
	include(implementation("org.apache.sshd:sshd-sftp:2.19.0"))

	// Optional: Steam transport via e4steam, supplied by e4steam at runtime.
	compileOnly "io.github.kamilhik:e4steam-api:${project.e4steam_api_version}"

	testImplementation platform("org.junit:junit-bom:5.13.4")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") { expand "version": version }
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach { it.options.release = 25 }

test { useJUnitPlatform() }

// Client game test: ./gradlew runClientGameTest (opens a Minecraft window and drives the real UI)
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "hearth-gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}
