[workspace]
resolver = "2"
members = [
    "crates/hearth-core",
    "crates/hearth-cli",
    "crates/hearth-transport",
    "crates/hearth-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Hearth Team"]

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.8", features = ["serde", "v4", "v7"] }
git2 = "0.18"
clap = { version = "4.5", features = ["derive", "env"] }
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
rmp-serde = "1.2"
sha2 = "0.10"
hex = "0.4"
dirs = "5.0"
semver = "1.0"
reqwest = { version = "0.12", features = ["json", "blocking"] }
tempfile = "3.8"
walkdir = "2.4"
async-trait = "0.1"
bytes = "1.5"
steamworks = { version = "0.11", features = [] }
which = "6.0"