name: Build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Test and package
        shell: bash
        run: |
          set +e
          ./gradlew test build --no-daemon > gradle.log 2>&1
          result=$?
          tail -80 gradle.log
          if [ "$result" -ne 0 ]; then
            failure=$(tail -40 gradle.log)
            failure=${failure//'%'/'%25'}
            failure=${failure//$'\r'/'%0D'}
            failure=${failure//$'\n'/'%0A'}
            echo "::error title=Gradle build failed::$failure"
          fi
          exit "$result"
