name: Build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Test and package
        shell: bash
        run: |
          set +e
          ./gradlew test build --no-daemon > gradle.log 2>&1
          result=$?
          tail -80 gradle.log
          if [ "$result" -ne 0 ]; then
            failure=$(tail -40 gradle.log)
            failure=${failure//'%'/'%25'}
            failure=${failure//$'\r'/'%0D'}
            failure=${failure//$'\n'/'%0A'}
            echo "::error title=Gradle build failed::$failure"
            python - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          for path in glob.glob('build/test-results/test/*.xml'):
              for failure in ET.parse(path).iter('failure'):
                  detail = (failure.text or '')[:12000]
                  detail = detail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print('::error title=JUnit failure::' + detail)
          PY
          fi
          exit "$result"
